name: EvenAI
options:
  bundleIdPrefix: com.evenai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  EvenAI:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenai.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Even AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: "EvenAI/Resources/PreviewContent"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
      # Both configs point at the live Railway backend (verified working:
      # /api/auth/*, /api/chats*, SSE streaming). Debug previously pointed
      # at localhost:3001 for local-server development; running from Xcode
      # uses the Debug config (see scheme's `run: config: Debug` below), so
      # that required a local server to be running to work at all. Switched
      # to Railway so a plain Xcode run reaches the same backend as
      # TestFlight/App Store builds. To point at a local server again for
      # backend development, override EVEN_AI_API_BASE_URL back to
      # http://localhost:3001/api here (or via an xcconfig override).
      configs:
        Debug:
          EVEN_AI_API_BASE_URL: "https://even-ai-assistant-asr-production.up.railway.app/api"
        Release:
          EVEN_AI_API_BASE_URL: "https://even-ai-assistant-asr-production.up.railway.app/api"
    info:
      path: EvenAI/Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        EVEN_AI_API_BASE_URL: "$(EVEN_AI_API_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false
  EvenAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EvenAI
  EvenAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAIUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EvenAI
schemes:
  EvenAI:
    build:
      targets:
        EvenAI: all
        EvenAITests: [test]
        EvenAIUITests: [test]
    test:
      targets:
        - EvenAITests
        - EvenAIUITests
    run:
      config: Debug
