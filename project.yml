name: EvenAI
options:
  bundleIdPrefix: com.evenai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  EvenAI:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenai.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Even AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: "EvenAI/Resources/PreviewContent"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
    info:
      path: EvenAI/Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        EVEN_AI_API_BASE_URL: "http://localhost:3001/api"
  EvenAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EvenAI
  EvenAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EvenAIUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EvenAI
schemes:
  EvenAI:
    build:
      targets:
        EvenAI: all
        EvenAITests: [test]
        EvenAIUITests: [test]
    test:
      targets:
        - EvenAITests
        - EvenAIUITests
    run:
      config: Debug
